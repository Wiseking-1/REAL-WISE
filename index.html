<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-primary:#0a0a0f;--bg-secondary:#111118;--bg-elevated:#1a1a24;--bg-input:#1e1e2a;--bg-hover:#252533;
    --border-subtle:rgba(255,255,255,0.06);--border-default:rgba(255,255,255,0.1);--border-strong:rgba(255,255,255,0.16);
    --text-primary:#f5f5f7;--text-secondary:#a1a1aa;--text-tertiary:#71717a;
    --accent:#6366f1;--accent-hover:#818cf8;--accent-glow:rgba(99,102,241,0.35);
    --accent-gradient:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#a855f7 100%);
    --success:#10b981;--danger:#ef4444;--pin-red:#ef4444;
    --radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--radius-full:9999px;
    --shadow-sm:0 1px 3px rgba(0,0,0,0.3);--shadow-md:0 4px 16px rgba(0,0,0,0.4);--shadow-lg:0 12px 40px rgba(0,0,0,0.5);
    --shadow-glow:0 0 24px var(--accent-glow);
    --sidebar-width:300px;--transition-fast:0.15s cubic-bezier(0.4,0,0.2,1);--transition-smooth:0.28s cubic-bezier(0.4,0,0.2,1);
  }
  body.light-mode {
    --bg-primary:#f9f9fb;--bg-secondary:#ffffff;--bg-elevated:#f3f4f6;--bg-input:#e5e7eb;--bg-hover:#e5e7eb;
    --border-subtle:rgba(0,0,0,0.06);--border-default:rgba(0,0,0,0.12);--border-strong:rgba(0,0,0,0.2);
    --text-primary:#111827;--text-secondary:#4b5563;--text-tertiary:#9ca3af;
  }
  body.light-mode .msg-content.user { color: #ffffff; }
  
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg-primary);color:var(--text-primary);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background 0.3s, color 0.3s}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:8px}
  body.light-mode ::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15)}
  
  #loginScreen{position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,rgba(99,102,241,0.15) 0%,transparent 50%),radial-gradient(circle at 80% 80%,rgba(168,85,247,0.12) 0%,transparent 50%),var(--bg-primary);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px;transition:opacity 0.4s ease;overflow-y:auto}
  #loginScreen.hidden{opacity:0;pointer-events:none;display:none}
  .login-card{width:100%;max-width:440px;background:var(--bg-secondary);border:1px solid var(--border-default);border-radius:var(--radius-xl);padding:36px 32px;box-shadow:var(--shadow-lg);animation:slideUp 0.5s;text-align:center;margin:auto}
  @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .login-logo{width:56px;height:56px;border-radius:var(--radius-lg);background:var(--accent-gradient);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 20px;box-shadow:var(--shadow-glow)}
  .login-title{font-size:26px;font-weight:700;letter-spacing:-0.02em;margin-bottom:6px}
  .login-subtitle{color:var(--text-secondary);font-size:14px;margin-bottom:24px}
  .auth-tabs{display:flex;background:var(--bg-elevated);border-radius:var(--radius-md);padding:4px;margin-bottom:20px;gap:4px}
  .auth-tab{flex:1;padding:9px;border-radius:var(--radius-sm);background:transparent;border:none;color:var(--text-secondary);font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:all var(--transition-fast)}
  .auth-tab.active{background:var(--accent-gradient);color:white;box-shadow:var(--shadow-sm)}
  .auth-panel{display:none;flex-direction:column;gap:10px}
  .auth-panel.active{display:flex}
  .auth-input-wrap{position:relative}
  .auth-input-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-tertiary);font-size:14px;pointer-events:none}
  .auth-input{width:100%;padding:13px 14px 13px 42px;background:var(--bg-input);border:1px solid var(--border-default);border-radius:var(--radius-md);color:var(--text-primary);font-size:14.5px;outline:none;font-family:inherit;transition:all var(--transition-fast)}
  .auth-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .auth-input::placeholder{color:var(--text-tertiary)}
  .auth-submit{width:100%;padding:13px;background:var(--accent-gradient);border:none;border-radius:var(--radius-md);color:white;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow-sm);transition:all var(--transition-fast);margin-top:6px}
  .auth-submit:hover{box-shadow:var(--shadow-glow);transform:translateY(-1px)}
  .auth-submit:disabled{opacity:0.6;cursor:not-allowed;transform:none}
  .auth-link{background:none;border:none;color:var(--accent-hover);font-size:13px;cursor:pointer;font-family:inherit;padding:6px;text-decoration:underline}
  .auth-divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--text-tertiary);font-size:12px}
  .auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border-subtle)}
  .social-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;margin-bottom:10px;border-radius:var(--radius-md);background:var(--bg-elevated);border:1px solid var(--border-default);color:var(--text-primary);font-size:14px;font-weight:500;cursor:pointer;transition:all var(--transition-fast);font-family:inherit}
  .social-btn:hover{background:var(--bg-hover);border-color:var(--border-strong)}
  .skip-auth{background:none;border:none;color:var(--text-secondary);font-size:13px;cursor:pointer;margin-top:12px;text-decoration:underline;font-family:inherit}
  .auth-error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;font-size:12.5px;padding:10px 12px;border-radius:var(--radius-sm);margin-bottom:8px;display:none;text-align:left}
  .auth-error.show{display:block}
  .auth-success{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:#6ee7b7;font-size:12.5px;padding:10px 12px;border-radius:var(--radius-sm);margin-bottom:8px;display:none;text-align:left}
  .auth-success.show{display:block}
  
  .app{display:flex;height:100vh;height:100dvh;width:100vw;overflow:hidden}
  .sidebar{width:var(--sidebar-width);min-width:var(--sidebar-width);background:var(--bg-secondary);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;height:100dvh;transition:transform var(--transition-smooth);z-index:40;overflow:hidden}
  .sidebar-header{padding:14px 16px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .brand{display:flex;align-items:center;gap:10px}
  .brand-logo{width:32px;height:32px;border-radius:10px;background:var(--accent-gradient);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 0 12px var(--accent-glow)}
  .brand-name{font-weight:600;font-size:17px}
  .sidebar-close-btn{background:transparent;border:none;color:var(--text-secondary);font-size:18px;cursor:pointer;width:36px;height:36px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;margin-left:auto}
  .sidebar-fixed-top{flex-shrink:0;padding:12px 10px 0 10px;background:var(--bg-secondary);z-index:2}
  .sidebar-scrollable{flex-grow:1;overflow-y:auto;padding:12px 10px 16px}
  .sidebar-scrollable::-webkit-scrollbar{width:6px}
  .sidebar-scrollable::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--accent) 0%,#8b5cf6 100%);border-radius:10px}
  .nav-btn{width:100%;display:flex;align-items:center;gap:14px;padding:12px 14px;margin-bottom:4px;background:transparent;border:none;color:var(--text-primary);font-size:15.5px;border-radius:var(--radius-full);cursor:pointer;transition:background var(--transition-fast);font-family:inherit;text-align:left;position:relative}
  .nav-btn:hover{background:var(--bg-elevated)}
  .nav-btn .nav-icon{width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px}
  .gradient-1{color:#a78bfa}.gradient-2{color:#f472b6}.gradient-3{color:#60a5fa}.gradient-4{color:#34d399}.gradient-5{color:#fbbf24}.gradient-6{color:#f97316}.gradient-7{color:#9ca3af}
  .nav-btn .nav-badge{margin-left:auto;font-size:11px;padding:2px 8px;background:rgba(99,102,241,0.18);color:var(--accent-hover);border-radius:99px;font-weight:600}
  .sidebar-search{position:relative;margin-bottom:12px}
  .sidebar-search input{width:100%;padding:14px 14px 14px 48px;background:var(--bg-elevated);border:1px solid transparent;border-radius:var(--radius-full);color:var(--text-primary);font-size:15px;outline:none;font-family:inherit}
  .sidebar-search input:focus{border-color:var(--accent)}
  .sidebar-search i{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--text-secondary)}
  .section{margin-bottom:14px}
  .section-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:var(--radius-full);cursor:pointer;color:var(--text-secondary);font-size:13.5px;font-weight:500}
  .section-header:hover{background:var(--bg-elevated)}
  .section-header .arrow{font-size:12px;transition:transform var(--transition-fast)}
  .section-header.open .arrow{transform:rotate(0)}
  .section-header:not(.open) .arrow{transform:rotate(-90deg)}
  .section-body{max-height:0;overflow:hidden;transition:max-height var(--transition-smooth)}
  .section-body.open{max-height:900px;overflow-y:auto}
  .chat-item{display:flex;align-items:center;gap:6px;padding:8px 6px 8px 12px;border-radius:var(--radius-full);margin:2px 0;cursor:pointer;font-size:15px;transition:background var(--transition-fast);position:relative}
  .chat-item:hover,.chat-item.active{background:var(--bg-elevated)}
  .chat-item .chat-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .chat-item .active-dot{width:8px;height:8px;border-radius:50%;background:#3b82f6;flex-shrink:0}
  .chat-item .chat-menu-btn{background:transparent;border:none;color:var(--text-secondary);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
  .chat-item.pinned::before{content:'📌';position:absolute;left:-2px;top:50%;transform:translateY(-50%);font-size:11px}
  .popup-menu{position:fixed;background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:0 10px 40px rgba(0,0,0,0.6);z-index:3000;display:none;flex-direction:column;padding:6px;min-width:200px}
  .popup-menu.show{display:flex}
  .popup-menu-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);background:transparent;border:none;color:var(--text-primary);font-size:14.5px;font-family:inherit;cursor:pointer;text-align:left;width:100%}
  .popup-menu-item:hover{background:var(--bg-hover)}
  .popup-menu-item i{width:20px;text-align:center;font-size:15px;color:var(--text-secondary)}
  .popup-menu-item.pin-item i{color:var(--pin-red)}
  .popup-menu-item.danger{color:#f87171}
  .sidebar-footer{border-top:1px solid var(--border-subtle);padding:12px;display:flex;align-items:center;gap:10px;flex-shrink:0}
  .user-chip{display:flex;align-items:center;gap:12px;flex:1;cursor:pointer;padding:6px 8px;border-radius:var(--radius-full)}
  .user-chip:hover{background:var(--bg-elevated)}
  .avatar{width:36px;height:36px;border-radius:var(--radius-full);background:var(--accent-gradient);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:white;overflow:hidden;flex-shrink:0;box-shadow:0 0 0 2px var(--bg-secondary),0 0 0 3px var(--border-default)}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .user-info{flex:1;min-width:0}
  .user-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-plan{font-size:12px;color:var(--text-tertiary)}
  .icon-action{width:36px;height:36px;border-radius:50%;background:transparent;border:none;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
  .chat-main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-primary);position:relative}
  .chat-topbar{padding:12px 20px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;gap:12px;background:rgba(10,10,15,0.8);backdrop-filter:blur(12px);z-index:10;flex-shrink:0}
  body.light-mode .chat-topbar { background: rgba(255,255,255,0.8); }
  .menu-btn{background:transparent;border:none;color:var(--text-primary);font-size:18px;cursor:pointer;padding:6px;border-radius:6px}
  .chat-title-wrap{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
  .chat-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat-model-badge{font-size:11px;padding:3px 8px;background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:var(--radius-full);color:var(--text-secondary);display:flex;align-items:center;gap:5px;white-space:nowrap}
  .chat-model-badge i{font-size:8px;color:var(--success)}
  .chat-actions{display:flex;align-items:center;gap:6px}
  .top-btn{background:transparent;border:1px solid transparent;color:var(--text-secondary);cursor:pointer;padding:7px 12px;border-radius:var(--radius-md);font-size:13px;font-family:inherit;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .top-btn:hover{background:var(--bg-elevated);color:var(--text-primary)}
  .top-btn.install-btn{background:var(--accent-gradient);color:white;border:none}
  .top-profile-container{position:relative;margin-left:8px;display:flex;align-items:center}
  .top-profile-avatar{width:38px;height:38px;border-radius:50%;cursor:pointer;border:2px solid var(--accent);overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--accent-gradient);color:white;font-weight:600;font-size:14px}
  .top-profile-avatar img{width:100%;height:100%;object-fit:cover}
  .profile-menu-popup{position:absolute;top:50px;right:0;width:340px;background:var(--bg-secondary);border:1px solid var(--border-default);border-radius:var(--radius-xl);box-shadow:0 16px 48px rgba(0,0,0,0.7);z-index:1000;display:none;flex-direction:column;overflow:hidden}
  .profile-menu-popup.show{display:flex}
  .pm-header{padding:18px 20px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:flex-start;justify-content:space-between;background:rgba(255,255,255,0.02)}
  .pm-user-info{display:flex;align-items:center;gap:14px}
  .pm-avatar{width:48px;height:48px;border-radius:50%;overflow:hidden;background:var(--accent-gradient);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:white;flex-shrink:0}
  .pm-avatar img{width:100%;height:100%;object-fit:cover}
  .pm-details{display:flex;flex-direction:column;min-width:0}
  .pm-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pm-email{font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .pm-close{background:transparent;border:none;color:var(--text-secondary);font-size:16px;cursor:pointer;padding:4px}
  .pm-body{padding:8px;display:flex;flex-direction:column;gap:4px}
  .pm-item{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:var(--radius-md);background:transparent;border:none;color:var(--text-primary);font-size:14.5px;font-weight:500;cursor:pointer;text-align:left;font-family:inherit}
  .pm-item:hover{background:var(--bg-elevated)}
  .pm-item i{width:20px;text-align:center;font-size:16px;color:var(--text-secondary)}
  .pm-item.danger{color:#f87171}
  .pm-divider{height:1px;background:var(--border-subtle);margin:4px 12px}
  .chat-scroll{flex:1;overflow-y:auto;padding:24px 20px 200px;scroll-behavior:smooth}
  .chat-inner{max-width:780px;margin:0 auto}
  .welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 20px;min-height:60vh}
  .welcome-logo{width:72px;height:72px;border-radius:var(--radius-xl);background:var(--accent-gradient);display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:20px;box-shadow:var(--shadow-glow)}
  .welcome h1{font-size:28px;font-weight:700;letter-spacing:-0.02em;margin-bottom:10px;background:linear-gradient(135deg,#f5f5f7,#a1a1aa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  body.light-mode .welcome h1 { background: linear-gradient(135deg, #111827, #4b5563); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .welcome p{color:var(--text-secondary);font-size:15px;max-width:480px;line-height:1.7}
  .welcome strong{color:var(--accent-hover)}
  .suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:32px;width:100%;max-width:600px}
  .suggestion-card{padding:14px 16px;background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);cursor:pointer;text-align:left;transition:all var(--transition-fast)}
  .suggestion-card:hover{background:var(--bg-elevated);border-color:var(--border-strong);transform:translateY(-2px);box-shadow:var(--shadow-md)}
  .suggestion-card i{color:var(--accent-hover);font-size:14px;margin-bottom:6px;display:block}
  .suggestion-card .sc-title{font-size:13.5px;font-weight:600;margin-bottom:2px}
  .suggestion-card .sc-desc{font-size:12px;color:var(--text-tertiary)}
  .message{display:flex;gap:14px;padding:8px 0;margin-bottom:8px;animation:msgIn 0.35s;position:relative}
  @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .message.user{flex-direction:row-reverse}
  .msg-avatar{width:34px;height:34px;border-radius:var(--radius-full);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;overflow:hidden;box-shadow:0 0 0 1px var(--border-default)}
  .msg-avatar.ai{background:var(--accent-gradient);color:white;box-shadow:0 0 0 1px var(--border-default),0 0 12px var(--accent-glow)}
  .msg-avatar.user{background:var(--bg-elevated);color:var(--text-secondary)}
  .msg-avatar img{width:100%;height:100%;object-fit:cover}
  .msg-body{flex:1;min-width:0;max-widthc:100%;padding-left:0}
  .message.user .msg-body{display:flex;flex-direction:column;align-items:flex-end}
  .msg-name{font-size:12.5px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;padding:0 4px;display:flex;align-items:center;gap:6px}
  .message.user .msg-name{text-align:right;flex-direction:row-reverse}
  .edited-tag{font-size:10.5px;color:var(--text-tertiary);font-style:italic;font-weight:400}
  .vision-tag{font-size:10.5px;color:var(--accent-hover);font-weight:500;display:inline-flex;align-items:center;gap:3px}
  .msg-content-wrap{position:relative;width:100%;display:flex}
  .message.user .msg-content-wrap{justify-content:flex-end}
  .msg-content{padding:12px 16px;border-radius:var(--radius-lg);font-size:15px;line-height:1.7;word-wrap:break-word;overflow-wrap:break-word;white-space:pre-wrap;max-width:100%}
  .msg-content.ai{
    background:transparent;
    border:none;
    padding:0;
    border-radius:0;
    width:100%;
    max-width:100%;
    font-size:15.5px;
    line-height:1.75;
    color:var(--text-primary);
  }
  .msg-content.user{background:var(--accent-gradient);color:white;border-top-right-radius:4px;box-shadow:var(--shadow-sm)}
